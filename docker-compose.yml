version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenproof
      POSTGRES_PASSWORD: greenproof
      POSTGRES_DB: greenproof
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://greenproof:greenproof@postgres:5432/greenproof
      JWT_SECRET: local-dev-secret
      API_PORT: '4000'
      STORAGE_DIR: /app/storage
    ports:
      - '4000:4000'
    depends_on:
      - postgres
    volumes:
      - ./apps/api:/app/apps/api
      - api-storage:/app/apps/api/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web

volumes:
  postgres-data:
  api-storage:
